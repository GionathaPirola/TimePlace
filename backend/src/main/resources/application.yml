spring:
  application:
    name: timeplace-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:timeplace}
    username: ${DB_USER:timeplace}
    password: ${DB_PASSWORD:timeplace}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    # Comma-separated list of allowed frontend origins (Vite dev server + Docker "full" profile).
    # Override in production via APP_CORS_ALLOWED_ORIGINS, e.g. https://timeplace.pages.dev
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  ingestion:
    enabled: false
    city: ""
    lat: 0
    lon: 0
    radius-meters: 1000
    sources: []
  wikimedia:
    base-url: https://commons.wikimedia.org/w/api.php
  europeana:
    base-url: https://api.europeana.eu/record/v2/search.json
    api-key: ${EUROPEANA_API_KEY:}

